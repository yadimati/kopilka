<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Копилка</title>
  <meta name="description" content="Личный учёт финансов: счета в любых валютах и крипте, цели, долги, анализ трат.">
  <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Копилка">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="secret-bar" hidden>
    <span>Особый режим · закроется при выходе</span>
    <button type="button" id="secret-close">Закрыть</button>
  </div>
  <div id="update-bar" hidden></div>

  <main id="view" aria-live="polite"></main>

  <nav id="tabs" aria-label="Разделы">
    <button type="button" data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4zM10 20v-5h4v5"/></svg><span>Главная</span></button>
    <button type="button" data-tab="ops"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Операции</span></button>
    <button type="button" data-tab="debts"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg><span>Долги</span></button>
    <button type="button" data-tab="analytics"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/></svg><span>Анализ</span></button>
    <button type="button" data-tab="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M10 10v4M18 16v4"/></svg><span>Настройки</span></button>
  </nav>

  <div id="sheet-root" hidden></div>
  <div id="onboard" hidden></div>
  <div id="code" hidden></div>
  <div id="toast" role="status" hidden></div>

  <noscript>Для работы Копилки нужен включённый JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
